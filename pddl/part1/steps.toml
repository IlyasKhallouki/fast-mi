cite = "data/scripts/room-028-bar/local-203.txt [001E] a click on 316 is accepted only while the cook (actor 6) is not in 28 at x > 310; obj-0316-door.txt [003F] needs state 1"
# The only window in which a click on 316 is accepted AND the door is open:
# the cook is out in the bar at x <= 310 (every cook target has x <= 285,
# docs/part1/money.md B2) and has opened 316 (local-216 [001B]).
