[actions."walk-into-bar"]
cite = "data/scripts/room-033-dock/obj-0428-door.txt [0035] Walk to 428 with state 1: loadRoomWithEgo(315,28)"
steps = [{verb = "walk_to", obj = {room = 33, name = "door"}, room = 33, until = [{room = 33}]}]

[actions."walk-into-kitchen"]
cite = "data/scripts/room-028-bar/local-203.txt [001E] a click on 316 is accepted only while the cook (actor 6) is not in 28 at x > 310; obj-0316-door.txt [003F] needs state 1"
# The only window in which a click on 316 is accepted AND the door is open:
# the cook is out in the bar at x <= 310 (every cook target has x <= 285,
# docs/part1/money.md B2) and has opened 316 (local-216 [001B]).
steps = [{verb = "walk_to", obj = {room = 28, name = "door", id = 316}, room = 28, until = [
  {actor_room = 6, eq = 28},
  {actor_x = 6, le = 310},
  {state = 316, eq = 1},
]}]

# The same sentence and window as walk-into-kitchen. Only the wait differs: after
# a provoke the cook comes out on local-212's 600-jiffy timer (docs/part1/model.md
# section 14), so this half of the split gets its own measured cost.
[actions."walk-into-kitchen-after-provoking-cook"]
cite = "data/scripts/room-028-bar/local-212.txt [0020] the provoked cook comes out after 600 jiffies; local-203.txt [001E] click guard; obj-0316-door.txt [003F] needs state 1"
steps = [{verb = "walk_to", obj = {room = 28, name = "door", id = 316}, room = 28, until = [
  {actor_room = 6, eq = 28},
  {actor_x = 6, le = 310},
  {state = 316, eq = 1},
]}]

