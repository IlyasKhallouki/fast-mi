# Part I step templates (contract C8): ground PDDL action -> plan-player steps.
#
# Keys are ground actions exactly as Fast Downward prints them (lower case):
# "walk <from> <to>" for every (link from to) in problem.pddl, and the bare
# name for every other action (they are all 0-ary). Object references are
# {room, name[, id]} with the names of the engine's object dump (C6); an
# inventory object is referenced in the room it starts in (pot 41, petal 58,
# mints 30, repellent 53, ...). `room` is the engine's _currentRoom; it is
# omitted for forest steps, because inside the forest _currentRoom is the
# pseudo-room 201-220 (room.cpp startScene), and those steps wait on
# VAR_ROOM (var 4) instead. Steps with no `room` (inventory-only sentences)
# run in whatever room ego is in. Design notes: docs/part1/model.md.

[verbs]
walk_to = "Walk to"
open = "Open"
close = "Close"
pick_up = "Pick up"
use = "Use"
give = "Give"
talk_to = "Talk to"
look_at = "Look at"
push = "Push"
pull = "Pull"

