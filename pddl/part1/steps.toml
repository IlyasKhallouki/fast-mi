cite = "data/scripts/room-052-circus-gr/obj-0621-circus-tent.txt [0014] loadRoom(51); local-207.txt [0213] [08AB] [0B49] the three menus"
# Menu 1: any line works; menu 2: "OK, I'll do it."; menu 3: "Of course I
# have a helmet..." ("have a helmet" alone would match both lines of menu 3).
steps = [{verb = "walk_to", obj = {room = 52, name = "circus tent"}, room = 52, until = [{room = 52}], choose = ["ahem", "I'll do it", "Of course"]}]

# The helmet. local-200 is the tent's input script only while var 32 (VAR_VERB_SCRIPT)
# is 200 (local-207 [0D4C]). Click Use, then the inventory slot just BEFORE the
# pot (local-200 [0107] reads Var[134+k], the display fills Var[133+k]). The
# reversed "Bobbin" menu opens while this step is still running.
[actions."walk-out-of-tent-after-helmet-meat"]
cite = "data/scripts/room-051-circus-te/local-200.txt [0107] Use + slot before the pot sets Bit[103] ([008B]); local-207.txt [110E] +478; [114D] walk-out"
