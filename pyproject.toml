[project]
name = "speedrun"
version = "0.1.0"
description = "Automated glitchless speedrunner for The Secret of Monkey Island"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["machfs==1.3"]

[project.scripts]
speedrun = "speedrun.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real game data and the patched ScummVM build",
    "requires_fd: needs the Fast Downward build",
]
addopts = "-ra"
